name: WordPress Plugin Check & PHP Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP files
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: Official WordPress Plugin Check (PCP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean distribution directory
        run: |
          mkdir -p /tmp/locala11y-dist
          rsync -av --exclude-from='.distignore' ./ /tmp/locala11y-dist/

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: /tmp/locala11y-dist
          slug: locala11y
          strict: true
